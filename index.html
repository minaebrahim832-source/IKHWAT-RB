 uv=u=>{u=u.trim();if(u.includes('@'))return;if(u.length<3||/\s/.test(u))throw new Error('اسم المستخدم 3 حروف على الأقل من غير مسافات');if(new TextEncoder().encode(u.toLowerCase()).length>31)throw new Error('اسم المستخدم طويل (الأقصى حوالي 15 حرف عربي أو 31 إنجليزي)')};
const em=m=>{m=m||'';return /^CODE_TAKEN:/.test(m)?'⚠️ '+m.slice(11).trim():/already|registered|exists/i.test(m)?'⚠️ الحساب ده مسجّل بالفعل':m},
 rnd=()=>'r'+[...crypto.getRandomValues(new Uint8Array(10))].map(b=>b.toString(16).padStart(2,'0')).join('')+'@gmail.com',
 cv=c=>{if(c.length<8||!/\p{L}/u.test(c)||!/[\d٠-٩]/.test(c))throw new Error('الكلمة لازم 8 حروف على الأقل وفيها حروف وأرقام (مثال: mina2026 أو مينا1234)')},
 rpc=(f,b,t)=>fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:{apikey:AK,Authorization:'Bearer '+(t||AK),'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.msg))||r.status);return j}),
 su=async(n,c)=>{const x=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},body:JSON.stringify({email:rnd(),password:c,data:{name:n}})}),j=await x.json();if(!x.ok)throw new Error(j.msg||j.message||x.status);if(!j.access_token)throw new Error('لازم تقفل Confirm email من إعدادات Supabase');await rpc('set_my_code',{code:c},j.access_token);return j};

async function chPw(){try{const n=$('#np').value;if(n!=$('#np2').value)throw new Error('الكلمتين مش زي بعض');cv(n);const q=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:AK,'Content-Type':'application/json'},body:JSON.stringify({email:S.user.email,password:$('#cp').value})});if(!q.ok)throw new Error('كلمة السر الحالية غلط');if(!(await rpc('code_free',{code:n},S.access_token)))throw new Error('⚠️ الكلمة دي مستخدمة، اختار كلمة تانية');
 const x=await fetch(SB+'/auth/v1/user',{method:'PUT',headers:{apikey:AK,Authorization:'Bearer '+S.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:n})}),j=await x.json().catch(()=>({}));if(!x.ok)throw new Error(j.msg||j.message||x.status);await rpc('set_my_code',{code:n},S.access_token);toast('تم تغيير كلمة السر');list()}catch(e){$('#pe').textContent=em(e.message)}}

async function addUser(){try{const n=$('#an').value.trim(),c=$('#ap').value,r=$('#ar').value;if(!n)throw new Error('اكتب الاسم');cv(c);if(!(await rpc('code_free',{code:c},S.access_token)))throw new Error('⚠️ الكلمة دي مستخدمة، اختار كلمة تانية');const j=await su(n,c);await api('/rest/v1/profiles?id=eq.'+j.user.id,{m:'PATCH',b:{active:true,role:r}});usersView()}catch(e){toast(em(e.message))}}
function toast(t,ok){let e=$('#ts');if(!e){e=document.createElement('div');e.id='ts';e.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;color:#fff;z-index:99;max-width:90%;text-align:center';document.body.appendChild(e)}t=String(t||'');e.style.background=(ok===undefined?/^تم/.test(t):ok)?'#0a6b3a':'#b3261e';e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',6000)}

async function usersView(){try{const u=await api('/rest/v1/profiles?select=id,name,role,active,email&order=active.asc,name.asc');$('#v').innerHTML='<div class="top"><button data-go>← رجوع</button><h2>المستخدمين</h2><span></span></div><fieldset><legend>إضافة مستخدم</legend><div class="g"><label>الاسم<input id="an"></label><label>كلمة السر الخاصة بيه<input id="ap" autocomplete="off"></label><label>الصلاحية<select id="ar"><option value="servant">خادم</option><option value="admin">مسئول</option></select></label></div><p><button class="p" data-au>إضافة</button></p></fieldset>'+u.map(x=>`<div class="card"><span><b>${esc(x.name)}</b> <small>${esc(x.email&&!/^r[0-9a-f]{20}@gmail\.com$/.test(x.email)&&!x.email.endsWith('@'+DOM)?x.email:'')}</small><br><small>${x.role=='admin'?'مسئول':'خادم'} — ${x.active?'مفعّل':'في انتظار التفعيل'}</small></span><span>${x.id==me.id?'<small>حسابك</small>':`<button class="${x.active?'d':'p'}" data-ua="${x.id}|${x.active?0:1}">${x.active?'إيقاف':'تفعيل'}</button> <button data-ur="${x.id}|${x.role=='admin'?'servant':'admin'}">${x.role=='admin'?'خليه خادم':'خليه مسئول'}</button> <button data-up="${x.id}">كلمة السر</button> <button class="d" data-ud="${x.id}">مسح</button>`}</span></div>`).join('')}catch(e){toast(e.message)}}
async function delUser(id){if(!(await ask('تمسح المستخدم ده نهائي؟ (لو عايز توقفه بس استخدم إيقاف)')))return;try{await api('/rest/v1/rpc/delete_user',{m:'POST',b:{uid:id}});usersView()}catch(e){toast(e.message)}}

 $('#L').innerHTML=`<p>${a.length+o.length} أسرة</p>`+a.map(r=>`<div class="card"><div><b>${esc(r.d.h_n||'—')} و ${esc(r.d.w_n||'—')}</b> <small>[${ST[r.st]}]</small><br><small>${esc(r.d.addr||'')} — أولاد: ${(r.d.children||[]).length}${r.note?' — ملاحظة: '+esc(r.note):''}</small></div><div><button data-open="${r.id}">فتح</button> <button data-prid="${r.id}">طباعة</button></div></div>`).join('')+o.map(r=>`<div class="card"><b>${esc(r.h_n||'—')} و ${esc(r.w_n||'—')}</b> <small>[${ST[r.status]}] اتعيّنت لخادم</small></div>`).join('')}

 const bad=document.querySelectorAll('input.bad').length;if(bad&&!(await ask('فيه '+bad+' رقم قومي مش 14 رقم. تحفظ برضه؟')))return;
 try{if(!cid){const r=await api('/rest/v1/families',{m:'POST',b:{data:cur}});cid=r[0].id;cst='pending'}
 else{const p={};for(const k of new Set([...Object.keys(cur),...Object.keys(orig)]))if(JSON.stringify(cur[k])!==JSON.stringify(orig[k]))p[k]=cur[k]===undefined?null:cur[k];if(Object.keys(p).length)await api('/rest/v1/rpc/patch_family',{m:'POST',b:{fid:cid,patch:p}})}
 orig=JSON.parse(JSON.stringify(cur));await load();draw();toast('تم الحفظ')}catch(e){toast(/^DUP:/.test(e.message)?'⚠️ '+e.message.slice(4).trim():'تعذّر الحفظ: '+e.message)}}

 $('#m').innerHTML=`<div class="mb"><b>اختار الخدام المسئولين (من 1 لـ 3)</b><br><small>الخادم اللي سجّل الأسرة بيتحسب مسئول تلقائي ومحسوب ضمن الـ 3</small>${s.map(x=>`<label><input type="checkbox" value="${x.id}"${on.includes(x.id)?' checked':''}> ${esc(x.name)}</label>`).join('')||'<p>مفيش خدام مسجّلين</p>'}<p><button class="p" data-do="apv">اعتماد</button> <button data-do="x">إلغاء</button></p></div>`;$('#m').style.display='flex'}catch(e){toast(e.message)}}

 const T=t=>{const[h,cols]=TB[t],a=r[t]||[];return `<h2>${h}</h2><table><tr>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}</tr>${a.map(x=>'<tr>'+cols.map(([k])=>'<td>'+esc(x[k])+'</td>').join('')+'</tr>').join('')||'<tr><td colspan="9">—</td></tr>'}</table>`};
 const s=a=>a.reduce((t,[k])=>t+num(r[k]),0);

 <table><tr><th>بيانات الزوج</th><th>بيانات الزوجة</th></tr><tr><td><table>${pe('h_')}</table></td><td><table>${pe('w_')}</table></td></tr></table>
 <h2>العنوان والسكن</h2><table>${P('العنوان',r.addr)}${P('المحافظة / الحي / المنطقة',[r.gov,r.dist,r.area].filter(Boolean).join(' / '))}${P('علامة مميزة',r.mark)}${P('السكن',r.house)}</table>
 ${T('children')}${T('others')}<h2>محتويات المنزل</h2><p>${CONT.map((n,i)=>n+': '+esc((r.c||{})[i]||'—')).join(' | ')}</p>
 <h2>الحالة الصحية والظروف</h2><table>${P('أمراض',r.ill)}${P('إعاقة',r.dis)}${P('ظروف أخرى',r.oth)}</table>${T('src')}${T('aid')}
 <h2>الدخل والمصروفات</h2><table><tr><th>الدخل</th><th></th><th>المصروفات</th><th></th></tr>${INC.map(([k,l],i)=>`<tr><td>${l}</td><td>${esc(r[k])}</td><td>${EXP[i][1]}</td><td>${esc(r[EXP[i][0]])}</td></tr>`).join('')}<tr><td><b>الإجمالي</b></td><td><b>${s(INC)}</b></td><td><b>الإجمالي</b></td><td><b>${s(EXP)}</b></td></tr></table>
 <p>الأب الكاهن المسئول: ${esc(r.priest)}</p><table><tr><th>اسم الكاهن المسئول</th><th>التوقيع</th><th>التاريخ</th><th>الختم</th></tr><tr><td style="height:60px"></td><td></td><td></td><td></td></tr></table>`;print()}
